# =====================================================================================
# Round 2 (added 2026-11-20, 25 questions). Written from the sources, NO searches run.
# Goal: cover what round 1 missed (see docs/LEARNING_NOTES.md section on good evals):
#   - runbooks that no round-1 question pointed at
#   - services that exist only as alerts in rules.yml (MySQL, MongoDB, SSL, clock)
#   - different question styles: how-to, paraphrase with no shared keywords, typos,
#     a long multi-symptom incident description, a truly ambiguous question
#   - "near-miss" unanswerable questions: same domain as the corpus, so retrieval
#     will return plausible-looking chunks and the system must still say "not found"
# =====================================================================================

