# Eval set for Alert Runbook RAG.
#
# How the expected answers were decided: by reading the source files in data/ (the runbook
# headings and the alert names in rules.yml), NOT by looking at what the search returned.
# `basis` says where in the sources the answer lives, so each line can be checked by hand.
#
# expected entries:
#   runbook: <path under docs/>   matches a chunk whose title starts with that path
#   alert:   <alert name>         matches a chunk whose alert_name equals it exactly
# A question is a HIT if ANY of the top K results matches ANY expected entry.
# answerable: false  = nothing in the corpus covers it; expected is empty (scored separately).

